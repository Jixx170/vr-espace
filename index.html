<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace IA — Quest 3</title>
  <link rel="stylesheet" href="style.css" />

  <!-- A-Frame 1.8.0 (dernière stable) -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <!-- Système de particules (poussière d'étoiles) -->
  <script src="https://unpkg.com/aframe-particle-system-component/dist/aframe-particle-system-component.min.js"></script>
</head>
<body>

  <a-scene
    webxr="optionalFeatures: dom-overlay; overlayElement: #overlay;"
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true;">

    <!-- Ciel 360°. Couleur de base en attendant la 1ère génération -->
    <a-sky id="sky360" color="#05050f" slow-rotate="speed: 0.7"></a-sky>

    <!-- Poussière d'étoiles autour du joueur -->
    <a-entity
      particle-system="preset: dust; color: #ffffff, #8ab4ff; particleCount: 2500; size: 0.6; maxAge: 10; positionSpread: 20 20 20; velocityValue: 0 0.03 0; velocitySpread: 0.4 0.1 0.4;">
    </a-entity>

    <!-- Rig + caméra -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera></a-camera>
    </a-entity>

    <!-- Panneau de statut visible EN VR (texte 3D natif, fonctionne même sans dom-overlay) -->
    <a-entity position="0 -0.35 -1.3" rotation="-12 0 0">
      <a-plane color="#000000" opacity="0.55" width="1.6" height="0.28"></a-plane>
      <a-text id="statusText3d" value="Pret. Tape ta description sur la page, puis entre en VR."
              align="center" color="#FFFFFF" width="2.4" position="0 0 0.01" wrap-count="42"></a-text>
    </a-entity>

  </a-scene>

  <!-- Overlay HTML : fonctionne de façon garantie AVANT d'entrer en VR (page 2D classique du Quest Browser).
       dom-overlay (optionalFeatures ci-dessus) est demandé au cas où le Quest Browser l'afficherait
       aussi pendant l'immersion, mais ce n'est PAS garanti en mode VR sur Quest 3 aujourd'hui —
       voir l'explication donnée par Claude après le code. -->
  <div id="overlay">
    <form id="promptForm" autocomplete="off">
      <input type="text" id="promptInput" placeholder="Ex: nébuleuse rouge, trou noir massif" />
      <button type="submit">Générer</button>
    </form>
    <p id="statusText2d">Prêt.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
