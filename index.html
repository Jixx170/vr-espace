<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05050f">
  <title>Espace IA — Quest 3</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-particle-system-component/dist/aframe-particle-system-component.min.js"></script>
</head>

<body>
  <a-scene
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: local-floor"
    renderer="colorManagement: true; antialias: true"
    background="color: #05050f">

    <!-- Décor 360° -->
    <a-sky
      id="sky360"
      color="#05050f"
      slow-rotate="speed: 0.7">
    </a-sky>

    <!-- Particules légères pour le Quest 3 -->
    <a-entity
      particle-system="
        preset: dust;
        color: #ffffff, #8ab4ff;
        particleCount: 1000;
        size: 0.6;
        maxAge: 10;
        positionSpread: 20 20 20;
        velocityValue: 0 0.03 0;
        velocitySpread: 0.4 0.1 0.4;">
    </a-entity>

    <!-- Joueur / caméra -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera></a-camera>

      <!-- Contrôleurs Quest -->
      <a-entity
        id="leftController"
        oculus-touch-controls="hand: left">
      </a-entity>

      <a-entity
        id="rightController"
        oculus-touch-controls="hand: right">
      </a-entity>
    </a-entity>

    <!-- Statut visible dans le casque -->
    <a-entity position="0 -0.35 -1.3" rotation="-12 0 0">
      <a-plane
        color="#000000"
        opacity="0.55"
        width="1.8"
        height="0.32">
      </a-plane>

      <a-text
        id="statusText3d"
        value="Chargement..."
        align="center"
        color="#FFFFFF"
        width="2.5"
        position="0 0 0.01"
        wrap-count="42">
      </a-text>
    </a-entity>

  </a-scene>

  <!-- Interface 2D dans le navigateur -->
  <div id="overlay">
    <form id="promptForm" autocomplete="off">
      <input
        type="text"
        id="promptInput"
        placeholder="Ex : nébuleuse violette, étoiles..."
        maxlength="300">
      <button type="submit">Générer</button>
    </form>

    <p id="statusText2d">Préparation du décor...</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
